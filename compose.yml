services:
  vast-monitor:
    build: .
    image: ghcr.io/moosegooseconsulting/vast-monitor:local
    container_name: vast-monitor
    restart: unless-stopped
    user: "1000:1000"
    ports: ["127.0.0.1:${VAST_MONITOR_PORT:-3010}:3000"]
    env_file: .env
    environment:
      PORT: "3000"
      VAST_API_KEY_PATH: ${VAST_API_KEY_PATH:-/home/node/.config/vastai/vast_api_key}
      VAST_CLI_PATH: /usr/local/bin/vast
      DB_PATH: ${DB_PATH:-/data/vast-monitor.db}
      RAW_ARCHIVE_ENABLED: ${RAW_ARCHIVE_ENABLED:-false}
      PLUGIN_MODULES: ${PLUGIN_MODULES:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
    volumes:
      - ${VAST_MONITOR_DATA_DIR:-./data}:/data
      - ${VAST_API_KEY_HOST_PATH:-./secrets/vast_api_key}:${VAST_API_KEY_PATH:-/home/node/.config/vastai/vast_api_key}:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
